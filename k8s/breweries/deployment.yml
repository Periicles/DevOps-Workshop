apiVersion: apps/v1
kind: Deployment
metadata:
  name: breweries-service
  labels:
    app: breweries-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: breweries-service
  template:
    metadata:
      labels:
        app: breweries-service
    spec:
      containers:
      - name: breweries-service
        image: periicles/breweries-service:latest
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: breweries-config
              key: jwt-secret
        - name: DB_PATH
          value: /app/data/breweries.db
        - name: NODE_ENV
          value: production

        volumeMounts:
        - name: data
          mountPath: /app/data

        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 30

        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: breweries-pvc
