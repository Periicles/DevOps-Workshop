apiVersion: apps/v1
kind: Deployment
metadata:
  name: breweries-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: breweries-service
  template:
    metadata:
      labels:
        app: breweries-service
    spec:
      containers:
      - name: breweries-service
        image: breweries-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "3001"
        - name: JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: breweries-config
              key: jwt-secret
        - name: DB_PATH
          value: /app/data/breweries.db
        - name: NODE_ENV
          value: production
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: data
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: breweries-pvc
